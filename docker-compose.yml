# One command runs everything:  docker compose up -d --build
# Needs sahab-api/.env (copy sahab-api/.env.example and add GEMINI_API_KEY).
services:
  api:
    build: ./sahab-api
    env_file: ./sahab-api/.env
    environment:
      RESULTS_DIR: /app/results
    volumes:
      - results:/app/results            # analyses survive restarts and redeploys
      - scene-cache:/tmp/sahab_cache    # downloaded satellite scenes (about 1 GB each)
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  results:
  scene-cache:
  caddy-data:
  caddy-config:
